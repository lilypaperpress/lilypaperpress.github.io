<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lily Paper Press — Colored Pages</title>
<style>
  body { margin: 0; background: #FBF8F2; color: #3A3330; font-family: Georgia, 'Times New Roman', serif; }

  header h1 { font-size: 1.35rem; font-weight: normal; margin: 0; letter-spacing: 0.04em; }

  figure { margin: 0; background: #fff; border: 1px solid #E7DfD3; border-radius: 12px; padding: 0.8rem; box-shadow: 0 2px 8px rgba(60,40,20,.07); }

  figcaption { text-align: center; font-size: 0.85rem; color: #8A7F76; padding-top: 0.6rem; }
  footer { text-align: center; font-size: 0.75rem; color: #B0A79C; padding-bottom: 2rem; }

<header>
  <h1>Lily Paper Press</h1>
  <p>Colored reference pages — color along, brain off</p>
</header>
<main>
  <figure>
    <img src="crystal-dragon.jpg" alt="Fully colored crystal dragon guardian coloring page in teal, pink and gold">
    <figcaption>Crystal Dragon — sample colored page</figcaption>
  </figure>

<footer>© Lily Paper Press</footer>
